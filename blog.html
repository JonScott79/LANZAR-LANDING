<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANZAR Mission Log</title>
    <meta name="description" content="LANZAR Mission Log - Thoughts, stories, and transmissions from a veteran-owned tech company in Hudson, MA.">
    <link rel="canonical" href="https://lanzar.me/blog.html">
    <link rel="icon" type="image/svg+xml" href="/assets/svg/favicon.svg">
    <meta property="og:title" content="LANZAR Mission Log" />
    <meta property="og:description" content="LANZAR Mission Log - Thoughts, stories, and transmissions from a veteran-owned tech company in Hudson, MA." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lanzar.me/blog.html" />
    <meta property="og:image" content="https://lanzar.me/assets/city/lanzar-city-master.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LANZAR Mission Log" />
    <meta name="twitter:description" content="LANZAR Mission Log - Thoughts, stories, and transmissions from a veteran-owned tech company in Hudson, MA." />
    <meta name="twitter:image" content="https://lanzar.me/assets/city/lanzar-city-master.jpg" />
    <style>
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--color-background); min-height: 100vh; display: flex; flex-direction: column;">
    
    
    <!-- BACKGROUND PATTERN -->
    <div style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none; opacity: 0.15; background: url('assets/svg/background.svg') center center; background-size: cover;"></div>

    <header class="site-header" style="position: relative; background: var(--color-primary);">
        <div class="header-logo">
            <a href="index.html"><img src="assets/svg/logo.svg" alt="LANZAR" class="nav-logo" style="height: 30px; filter: brightness(0) invert(1);" /></a>
        </div>
        <nav class="site-nav">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link" style="color: var(--color-cream);">RETURN TO LAUNCH PAD</a></li>
            </ul>
        </nav>
    </header>

    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1rem;">
        <h1 class="sr-only">LANZAR Mission Log</h1>
        <div class="terminal-scene" style="width: 100%;">
            <div class="terminal-enclosure">
                <div class="terminal-casing">
                    <!-- Header / Indicators -->
                    <div class="terminal-header-bar">
                        <span class="led-red"></span>
                        <span class="led-green"></span>
                        <span class="terminal-label">LANZAR MISSION LOG // SYS.01</span>
                    </div>
                    
                    <!-- CRT Screen Bezel -->
                    <div class="terminal-screen-bezel">
                        <div class="crt-scanlines"></div>
                        <div class="crt-glare"></div>
                        <iframe id="blog-display" src="blog/philosophy.html" title="LANZAR Journal Transmission"></iframe>
                    </div>
                    
                    <!-- Chunky Control Panel -->
                    <div class="terminal-control-panel">
                        <button id="blog-previous" class="retro-btn">◀ PREV</button>
                        <div class="ventilation-grille">
                            <span></span><span></span><span></span><span></span><span></span><span></span>
                        </div>
                        <button id="blog-next" class="retro-btn">NEXT ▶</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js" type="module"></script>
</body>
</html>
